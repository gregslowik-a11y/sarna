
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251a">
  <title>Leśna AR — sarna 3D</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17251a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px 15px;
      border-radius: 14px;
      background: rgba(15, 32, 21, .92);
      border: 1px solid #ffffff40;
      pointer-events: none;
    }

    .topbar strong { letter-spacing: 2px; }
    .topbar span { display: block; font-size: 12px; margin-top: 4px; }

    .status {
      position: fixed;
      z-index: 5;
      bottom: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 14px;
      background: rgba(15, 32, 21, .92);
      border: 1px solid #ffffff40;
    }

    .overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(9, 20, 12, .96);
    }

    .panel {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border: 1px solid #ffffff40;
      border-radius: 22px;
      background: #19291d;
    }

    .panel h1 { font-size: 30px; margin: 10px 0; }
    .panel p { line-height: 1.5; color: #e0e7dc; }

    button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 24px;
      padding: 14px 18px;
      margin-top: 12px;
      background: #d7e8a6;
      color: #17251a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .65; }

    #message {
      font-size: 13px;
      overflow-wrap: anywhere;
      min-height: 18px;
    }

    .hidden { display: none !important; }
  </style>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <div class="topbar">
    <strong>LEŚNA AR</strong>
    <span>Skieruj aparat na wydruk lasu i jeziora</span>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./tlo_las_jezioro.mind; autoStart: false; uiScanning: true"
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="deerModel"
        src="./male_deer_animal_3d_model_free.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-camera>

    <!-- Mniejsza sarna, aby nie zasłaniała całej planszy -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="deer"
        src="#deerModel"
        position="0 -0.15 0.05"
        rotation="0 180 0"
        scale="0.8 0.8 0.8">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <div id="status" class="status">
    Gotowe. Naciśnij przycisk, aby uruchomić aparat.
  </div>

  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1>Ożyw leśną scenerię</h1>

      <p>
        Uruchom aparat i skieruj go na wydrukowany obraz
        lasu i jeziora. Po rozpoznaniu grafiki pojawi się sarna 3D.
      </p>

      <button id="startButton" type="button">
        Uruchom aparat
      </button>

      <p id="message">
        Wymagany internet i dostęp do aparatu.
      </p>
    </div>
  </div>

  <script>
    (() => {
      const scene = document.getElementById("arScene");
      const startScreen = document.getElementById("startScreen");
      const startButton = document.getElementById("startButton");
      const status = document.getElementById("status");
      const message = document.getElementById("message");

      let starting = false;

      function showError(text) {
        message.textContent = text;
        startButton.disabled = false;
        startButton.textContent = "Spróbuj ponownie";
        starting = false;
      }

      function waitForScene() {
        return new Promise((resolve, reject) => {
          if (scene.hasLoaded) {
            resolve();
            return;
          }

          const timer = setTimeout(() => {
            reject(new Error(
              "Scena AR nie załadowała się. Odśwież stronę."
            ));
          }, 20000);

          scene.addEventListener("loaded", () => {
            clearTimeout(timer);
            resolve();
          }, { once: true });
        });
      }

      scene.addEventListener("targetFound", () => {
        status.textContent =
          "Rozpoznano planszę! Sarna powinna być widoczna.";
      });

      scene.addEventListener("targetLost", () => {
        status.textContent =
          "Skieruj aparat ponownie na cały wydruk.";
      });

      startButton.addEventListener("click", async () => {
        if (starting) return;

        starting = true;
        startButton.disabled = true;
        startButton.textContent = "Uruchamiam aparat...";
        message.textContent = "Sprawdzam system AR...";

        try {
          if (!window.isSecureContext) {
            throw new Error(
              "Otwórz stronę przez HTTPS, np. GitHub Pages."
            );
          }

          if (!window.AFRAME) {
            throw new Error(
              "Nie załadował się A-Frame. Sprawdź internet i odśwież stronę."
            );
          }

          await waitForScene();

          const arSystem =
            scene.systems["mindar-image-system"];

          if (!arSystem || typeof arSystem.start !== "function") {
            throw new Error(
              "Nie załadował się system AR. Sprawdź połączenie z internetem."
            );
          }

          message.textContent = "Proszę czekać, uruchamiam aparat...";

          await arSystem.start();

          startScreen.classList.add("hidden");
          status.textContent =
            "Aparat działa. Skieruj go na wydruk lasu i jeziora.";

        } catch (error) {
          console.error("Błąd Leśna AR:", error);
          showError(
            error && error.message
              ? error.message
              : "Nie udało się uruchomić aparatu."
          );
        }
      });

      window.addEventListener("error", event => {
        console.error("Błąd strony:", event.message);
      });
    })();
  </script>

</body>
</html>
