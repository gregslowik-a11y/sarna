
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251a">
  <title>Leśna AR — sarna 3D</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      color: white;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      z-index: 1;
    }

    a-scene canvas {
      background: transparent !important;
    }

    .topbar, .status {
      position: fixed;
      z-index: 5;
      left: 12px;
      right: 12px;
      padding: 12px 15px;
      border-radius: 14px;
      background: rgba(15, 32, 21, .82);
      border: 1px solid #ffffff40;
      text-align: center;
      pointer-events: none;
    }

    .topbar { top: 12px; }
    .topbar strong { letter-spacing: 2px; }
    .topbar span { display: block; font-size: 12px; margin-top: 4px; }
    .status { bottom: 12px; font-size: 14px; line-height: 1.4; }

    .overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #102016;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border: 1px solid #ffffff40;
      border-radius: 22px;
      background: #19291d;
    }

    .panel h1 { font-size: 29px; margin: 10px 0; }
    .panel p { line-height: 1.5; color: #e0e7dc; }

    button {
      width: 100%;
      border: 0;
      border-radius: 24px;
      padding: 15px;
      margin-top: 12px;
      background: #d7e8a6;
      color: #17251a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .65; }
    #message { font-size: 13px; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
  </style>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <div class="topbar">
    <strong>LEŚNA AR</strong>
    <span>Skieruj aparat na wydruk lasu i jeziora</span>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./tlo_las_jezioro.mind; autoStart: false; uiScanning: true"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
    background="transparent: true; color: #000000"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="deerModel"
        src="./male_deer_animal_3d_model_free.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="deer"
        src="#deerModel"
        position="0 0 0.05"
        rotation="0 135 0"
        scale="1.2 1.2 1.2">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <div id="status" class="status">
    Gotowe. Naciśnij przycisk, aby uruchomić aparat.
  </div>

  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1>Ożyw leśną scenerię</h1>
      <p>
        Naciśnij przycisk i zezwól na dostęp do aparatu.
        Następnie skieruj telefon na wydrukowany obraz lasu i jeziora.
      </p>
      <button id="startButton" type="button">Uruchom aparat</button>
      <p id="message">Wymagane połączenie z internetem.</p>
    </div>
  </div>

  <script>
    (() => {
      const scene = document.getElementById("arScene");
      const screen = document.getElementById("startScreen");
      const button = document.getElementById("startButton");
      const status = document.getElementById("status");
      const message = document.getElementById("message");
      let starting = false;

      function showError(error) {
        message.textContent =
          error && error.message
            ? error.message
            : "Nie udało się uruchomić AR.";
        button.disabled = false;
        button.textContent = "Spróbuj ponownie";
        starting = false;
      }

      scene.addEventListener("targetFound", () => {
        status.textContent =
          "Plansza rozpoznana — sarna powinna być widoczna.";
      });

      scene.addEventListener("targetLost", () => {
        status.textContent =
          "Skieruj aparat ponownie na cały wydruk.";
      });

      button.addEventListener("click", async () => {
        if (starting) return;

        starting = true;
        button.disabled = true;
        button.textContent = "Uruchamiam aparat...";
        message.textContent = "Sprawdzam system AR...";

        try {
          if (!window.isSecureContext) {
            throw new Error("Otwórz stronę przez HTTPS.");
          }

          if (!window.AFRAME) {
            throw new Error(
              "Nie załadowała się biblioteka A-Frame. Sprawdź internet."
            );
          }

          if (!scene.hasLoaded) {
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                reject(new Error(
                  "Scena AR nie załadowała się. Odśwież stronę."
                ));
              }, 20000);

              scene.addEventListener("loaded", () => {
                clearTimeout(timer);
                resolve();
              }, { once: true });
            });
          }

          const system = scene.systems["mindar-image-system"];

          if (!system || typeof system.start !== "function") {
            throw new Error(
              "System AR nie został załadowany. Sprawdź internet."
            );
          }

          message.textContent = "Uruchamiam aparat...";
          await system.start();

          screen.classList.add("hidden");
          status.textContent =
            "Aparat działa. Szukam wydrukowanej planszy...";

        } catch (error) {
          console.error("Błąd Leśna AR:", error);
          showError(error);
        }
      });
    })();
  </script>
</body>
</html>
