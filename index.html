
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251a">
  <title>Leśna AR — sarna 3D</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17251a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .topbar, .status {
      position: fixed;
      z-index: 5;
      background: rgba(15, 32, 21, .9);
      border: 1px solid #ffffff40;
      border-radius: 14px;
      padding: 12px 15px;
    }

    .topbar {
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .topbar strong { letter-spacing: 2px; }
    .topbar span { display: block; font-size: 12px; margin-top: 4px; }

    button {
      border: 0;
      border-radius: 24px;
      padding: 13px 18px;
      background: #d7e8a6;
      color: #17251a;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    .status {
      left: 12px;
      right: 12px;
      bottom: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(9, 20, 12, .94);
    }

    .panel {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border: 1px solid #ffffff40;
      border-radius: 22px;
      background: #19291d;
    }

    .panel h1 { font-size: 30px; margin: 10px 0; }
    .panel p { line-height: 1.5; color: #e0e7dc; }
    .panel button { width: 100%; margin-top: 10px; }
    #message { font-size: 13px; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
  </style>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR: ścieżka do właściwego pliku biblioteki -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <div class="topbar">
    <div>
      <strong>LEŚNA AR</strong>
      <span>Skieruj aparat na wydruk lasu i jeziora</span>
    </div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./tlo_las_jezioro.mind;
      autoStart: false;
      uiScanning: true;
      filterMinCF: 0.0001;
      filterBeta: 0.001
    "
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="deerModel"
        src="./male_deer_animal_3d_model_free.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-camera>

    <!-- Sarna pojawi się po rozpoznaniu wydrukowanego obrazu -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="deer"
        src="#deerModel"
        position="0 0 0.05"
        rotation="0 180 0"
        scale="7.5 7.5 7.5">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <div id="status" class="status">
    Gotowe. Naciśnij przycisk, aby uruchomić aparat.
  </div>

  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1>Ożyw leśną scenerię</h1>
      <p>
        Uruchom aparat i skieruj go na wydrukowany obraz
        lasu i jeziora. Po rozpoznaniu grafiki pojawi się sarna 3D.
      </p>

      <button id="startButton" type="button">
        Uruchom aparat
      </button>

      <p id="message">
        Wymagane połączenie z internetem i dostęp do aparatu.
      </p>
    </div>
  </div>

  <script>
    (() => {
      const scene = document.getElementById("arScene");
      const startScreen = document.getElementById("startScreen");
      const startButton = document.getElementById("startButton");
      const status = document.getElementById("status");
      const message = document.getElementById("message");

      let started = false;

      function showError(text) {
        message.textContent = text;
        startButton.disabled = false;
        startButton.textContent = "Spróbuj ponownie";
      }

      scene.addEventListener("targetFound", () => {
        status.textContent = "Rozpoznano obraz! Sarna powinna być widoczna.";
      });

      scene.addEventListener("targetLost", () => {
        status.textContent = "Nie widzę planszy. Ustaw cały wydruk w kadrze.";
      });

      startButton.addEventListener("click", async () => {
        if (started) return;

        startButton.disabled = true;
        startButton.textContent = "Uruchamiam...";
        message.textContent = "Sprawdzam system AR...";

        try {
          if (!window.isSecureContext) {
            throw new Error(
              "Otwórz stronę przez HTTPS, np. GitHub Pages."
            );
          }

          if (!window.AFRAME) {
            throw new Error(
              "Nie załadował się A-Frame. Sprawdź internet i odśwież stronę."
            );
          }

          if (!AFRAME.systems["mindar-image"]) {
            throw new Error(
              "Nie załadowała się biblioteka MindAR. Sprawdź połączenie z internetem lub spróbuj ponownie później."
            );
          }

          if (!scene.hasLoaded) {
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                reject(new Error(
                  "Scena AR ładuje się zbyt długo. Odśwież stronę."
                ));
              }, 20000);

              scene.addEventListener("loaded", () => {
                clearTimeout(timer);
                resolve();
              }, { once: true });
            });
          }

          const system = scene.systems["mindar-image-system"];

          if (!system) {
            throw new Error(
              "System AR nie został uruchomiony. Sprawdź, czy biblioteka MindAR załadowała się poprawnie."
            );
          }

          message.textContent = "Uruchamiam aparat...";
          await system.start();

          started = true;
          startScreen.classList.add("hidden");
          status.textContent =
            "Aparat działa. Skieruj go na wydrukowany obraz lasu i jeziora.";

        } catch (error) {
          console.error("Błąd uruchamiania AR:", error);

          showError(
            error && error.message
              ? error.message
              : "Nie udało się uruchomić AR."
          );
        }
      });
    })();
  </script>

</body>
</html>
